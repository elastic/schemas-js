---
name: Node CI

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  validate-pr-title:
    if: github.event_name == 'pull_request'
    name: Validate PR title
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@639145d78959c53c43112365837e3abd21ed67c1 # v1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: "false"

  test-unit:
    name: Unit tests
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 25.x]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install
        run: npm install

      - name: Run unit tests
        run: npm run test:unit
        shell: bash

  test-lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Run linter
        run: npm run test:lint

  test-build-esm:
    name: Type checker + ESM build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Check types + validate ESM build script
        run: npm run build:esm

  test-build-cjs:
    name: CJS build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Validate CJS build script
        run: npm run build:cjs

  license:
    name: License check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x

      - name: Install
        run: npm install

      - name: License checker
        run: npm run license-checker

      - name: SPDX header check
        run: npm run license-header

  test-bun:
    name: Test Bun
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install
        run: bun install

      - name: Unit test (Bun)
        shell: bash
        run: bun run test:unit

  test-cli:
    name: elastic/cli integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: schemas

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Build and pack @elastic/schemas
        working-directory: schemas
        run: |
          npm install
          npm run build
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "SCHEMAS_TARBALL=$(ls "$RUNNER_TEMP"/elastic-schemas-*.tgz)" >> "$GITHUB_ENV"

      - name: Clone elastic/cli
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elastic/cli
          ref: main
          persist-credentials: false
          path: cli

      - name: Install PR schemas into elastic/cli
        working-directory: cli
        run: npm install && npm install "$SCHEMAS_TARBALL"

      - name: Build elastic/cli
        working-directory: cli
        run: npm run build

      - name: Test elastic/cli
        working-directory: cli
        env:
          NODE_OPTIONS: --test-isolation=none
        shell: bash
        run: |
          # manifest drift is expected when testing a new @elastic/schemas
          rm test/lib/manifest-drift.test.ts
          npm test

  ci:
    name: CI Result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - license
      - test-build-esm
      - test-build-cjs
      - test-bun
      - test-lint
      - test-unit
      - test-cli
      - validate-pr-title
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
